[project]
name = "type-url"
version = "0.1.11"
description = "A simple type to handle URL interactions"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Kalle M. Krog Aagaard", email = "git@k-moeller.dk"},
]
maintainers = [
    {name = "Kalle M. Krog Aagaard", email = "git@k-moeller.dk"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]


[project.urls]
Homepage = "https://github.com/KalleDK/py-type-url"
Documentation = "https://github.com/KalleDK/py-type-url"
Repository = "https://github.com/KalleDK/py-type-url.git"



[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
stubs = [
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "type_url"

[tool.pyright]
include = ["src", "tests", "examples"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.pytest.ini_options]
addopts = "-v --cov=type_url --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
